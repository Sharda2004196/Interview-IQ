# Render Blueprint — InterviewIQ prod (free tier).
# Deploy: Render dashboard -> New -> Blueprint -> point at the GitHub repo.
# Secrets (sync: false) are filled ONCE in the dashboard, never committed.
services:
  - type: web
    name: interviewiq-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: FALSE
      - key: PINECONE_INDEX
        value: interviewiq-kb
      - key: VOICE_LIVE_ENABLED
        value: false
      - key: LANGFUSE_ENV
        value: production
      # Keep in sync with the dashboard value. Without it the code falls back to
      # AUTH_MODE=open (no token -> dev user) — see backend/auth.py.
      - key: AUTH_MODE
        value: strict
      # Filled in the dashboard AFTER the frontend URL is known.
      # Comma separated if more than one origin must be allowed, e.g.
      # FRONTEND_URL=https://interviewiq.vercel.app,https://old.onrender.com
      # The frontend itself is hosted on Vercel now, not as a Render service.
      - key: GOOGLE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false

